<!doctype html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="theme-color" content="#0A0D14">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Condensed:wght@600;700&family=Big+Shoulders+Display:wght@800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app">
    <nav class="tabs" aria-label="Sections">
      <div class="brand" aria-hidden="true">
        <svg viewBox="0 0 512 512"><rect width="512" height="512" rx="112" fill="#111A2C"/><g transform="translate(256 250)"><path d="M-104 -40c0-70 46-112 112-112 74 0 118 44 118 118 0 50-18 86-46 110v38h-152v-46c-22-24-32-60-32-108z" fill="#E2453C"/><path d="M-104 -20c-26 0-46 22-46 50s20 52 50 52c10 0 18-2 24-6" fill="#C8322B"/><rect x="-80" y="104" width="160" height="58" rx="14" fill="#F2B33D"/></g></svg>
        <div><b>Peekaboo</b><span>Steve Fox · Tekken 7</span></div>
      </div>
      <button type="button" data-action="tab" data-v="learn">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h7a2 2 0 0 1 2 2v13a2 2 0 0 0-2-2H4zM20 5h-5a2 2 0 0 0-2 2v13a2 2 0 0 1 2-2h5z"/></svg>
        <span>Learn</span>
      </button>
      <button type="button" data-action="tab" data-v="moves">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>
        <span>Moves</span>
      </button>
      <button type="button" data-action="tab" data-v="combos">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 3L5 13h6l-1 8 8-10h-6z"/></svg>
        <span>Combos</span>
      </button>
      <button type="button" data-action="tab" data-v="tech">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M8 7.5l2.5 8M16 7.5l-2.5 8M8.5 6h7"/></svg>
        <span>Tech</span>
      </button>
      <button type="button" data-action="tab" data-v="train">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="0.6"/></svg>
        <span>Train</span>
      </button>
      <button type="button" data-action="tab" data-v="videos">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9l5 3-5 3z"/></svg>
        <span>Videos</span>
      </button>
      <div id="rail-progress" class="rail-progress"></div>
    </nav>
    <main id="view" class="view" tabindex="-1"></main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>

</html>
