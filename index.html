<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Peekaboo</title>
  <meta name="description" content="A beginner-friendly Tekken 7 Steve Fox guide: move list with frame data, punishers, combos, tech and video guides.">
  <meta name="theme-color" content="#111A2C">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Condensed:wght@600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app">
    <main id="view" class="view" tabindex="-1"></main>
    <nav class="tabs" aria-label="Sections">
      <button type="button" data-action="tab" data-v="learn">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h7a2 2 0 0 1 2 2v13a2 2 0 0 0-2-2H4zM20 5h-5a2 2 0 0 0-2 2v13a2 2 0 0 1 2-2h5z"/></svg>
        <span>Learn</span>
      </button>
      <button type="button" data-action="tab" data-v="moves">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>
        <span>Moves</span>
      </button>
      <button type="button" data-action="tab" data-v="combos">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18c3-8 6-12 8-12s3 4 3 6-1 4 1 4 3-3 4-6"/></svg>
        <span>Combos</span>
      </button>
      <button type="button" data-action="tab" data-v="tech">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z"/></svg>
        <span>Tech</span>
      </button>
      <button type="button" data-action="tab" data-v="train">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="0.5"/></svg>
        <span>Train</span>
      </button>
      <button type="button" data-action="tab" data-v="videos">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9l5 3-5 3z"/></svg>
        <span>Videos</span>
      </button>
    </nav>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
